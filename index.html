<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自作アプリ一覧</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#222; --sub:#666; --accent:#2f6fed; --border:#e1e4e8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181c; --card:#20242a; --text:#e8eaed; --sub:#9aa0a6; --accent:#6c9bff; --border:#33383f; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Yu Gothic UI","Meiryo",sans-serif; background:var(--bg); color:var(--text); }
  header { padding:24px 16px 8px; max-width:960px; margin:0 auto; }
  h1 { margin:0 0 4px; font-size:1.6rem; }
  .count { color:var(--sub); font-size:.9rem; }
  .tools { max-width:960px; margin:0 auto; padding:8px 16px; display:flex; gap:8px; flex-wrap:wrap; }
  .tools input, .tools select { padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--text); font-size:1rem; }
  .tools input { flex:1; min-width:180px; }
  main { max-width:960px; margin:0 auto; padding:8px 16px 32px; display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
  .card { display:block; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; text-decoration:none; color:inherit; transition:transform .1s, box-shadow .1s; }
  .card:hover { transform:translateY(-2px); box-shadow:0 4px 12px rgba(0,0,0,.12); }
  .card h2 { margin:0 0 6px; font-size:1.1rem; color:var(--accent); }
  .card p { margin:0 0 10px; font-size:.9rem; color:var(--sub); }
  .meta { display:flex; gap:6px; flex-wrap:wrap; font-size:.75rem; }
  .tag { background:var(--bg); border:1px solid var(--border); border-radius:999px; padding:2px 8px; }
  .empty { grid-column:1/-1; text-align:center; color:var(--sub); padding:40px 0; }
</style>
</head>
<body>
<header>
  <h1>自作アプリ一覧</h1>
  <div class="count" id="count"></div>
</header>
<div class="tools">
  <input id="q" type="search" placeholder="アプリ名・説明で検索">
  <select id="cat"><option value="">すべてのカテゴリ</option></select>
</div>
<main id="list"></main>

<script>
// ===== アプリ登録欄 =====
// 追加するときは、下の配列に1件ずつ書き足す。
// 例: { name:"出勤簿", desc:"勤怠を記録するアプリ", path:"../dev/kintai/index.html", category:"仕事", updated:"2026-09-27" },
const apps = [
  { name:"出勤簿", desc:"出退勤を記録する勤怠アプリ", path:"../260926 index/kintai.html", category:"仕事", updated:"2026-09-27" },
  { name:"掃除タスクマネージャー", desc:"掃除の予定とタスクを管理", path:"../260926 index/soji-manager.html", category:"生活", updated:"2026-09-24" },
  { name:"定期券", desc:"定期券の更新記録", path:"../260926 index/teiki-manager.html", category:"生活", updated:"2026-09-27" },
  { name:"貸出台帳", desc:"貸出を記録", path:"../260926 index/lending_ledger.html", category:"生活", updated:"2026-09-27" },
];
// ========================

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// カテゴリの選択肢を作る
[...new Set(apps.map(a => a.category).filter(Boolean))].forEach(c => {
  $("cat").insertAdjacentHTML("beforeend", `<option>${esc(c)}</option>`);
});

function render() {
  const q = $("q").value.trim().toLowerCase();
  const cat = $("cat").value;
  const hit = apps.filter(a =>
    (!cat || a.category === cat) &&
    (!q || (a.name + " " + (a.desc || "")).toLowerCase().includes(q)));
  $("count").textContent = `全${apps.length}件` + (hit.length !== apps.length ? `（表示${hit.length}件）` : "");
  $("list").innerHTML = hit.length ? hit.map(a => `
    <a class="card" href="${esc(a.path)}">
      <h2>${esc(a.name)}</h2>
      <p>${esc(a.desc)}</p>
      <div class="meta">
        ${a.category ? `<span class="tag">${esc(a.category)}</span>` : ""}
        ${a.updated ? `<span class="tag">更新 ${esc(a.updated)}</span>` : ""}
      </div>
    </a>`).join("")
    : `<div class="empty">${apps.length ? "該当するアプリがありません" : "まだアプリが登録されていません。index.html の apps 配列に追加してください。"}</div>`;
}
$("q").addEventListener("input", render);
$("cat").addEventListener("change", render);
render();
</script>
</body>
</html>
